name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token scope. Nothing here writes anything; it checks out and runs
# checks.
permissions:
  contents: read

jobs:
  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: whatsapp-bridge/go.mod
      - run: go build -v .
      - run: go vet ./...
      - run: go test ./...

  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Pinned to the exact tag: setup-uv stopped publishing moving major tags
      # after v7, so `@v9` does not resolve. Dependabot tracks exact tags fine.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -v
